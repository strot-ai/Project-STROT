[tool.poetry]
name = "strot-ai"
version = "0.2.0"
description = "STROT: compile-time LLM code synthesis with deterministic, self-routing NLU runtimes (local transformer or hosted API)"
authors = ["Amit Rath <amitrath.ar@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/strot-ai/Project-STROT"
keywords = ["strot", "nlu", "code-generation", "llm", "routing", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
packages = [{ include = "strot", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
# The core library is pure-stdlib. Runtime strategies pull in heavy
# dependencies only through extras, so a hosted-API production container
# never ships torch/transformers.
transformers = { version = ">=4.40", optional = true }
torch = { version = ">=2.1", optional = true }
openai = { version = ">=1.30", optional = true }
anthropic = { version = ">=0.80", optional = true }

[tool.poetry.extras]
local = ["transformers", "torch"]
hosted = ["openai"]
anthropic = ["anthropic"]
all = ["transformers", "torch", "openai", "anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
